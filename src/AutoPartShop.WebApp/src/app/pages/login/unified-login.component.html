<div class="ul-page">
  <div class="ul-card">

    <!-- Logo -->
    <div class="ul-logo">
      <div class="ul-logo-mark">{{ brandInitials }}</div>
      <div class="ul-logo-text">
        <span class="ul-logo-title">{{ branding.appName() }}</span>
        <span class="ul-logo-sub">Management System</span>
      </div>
    </div>

    <h2 class="ul-heading">Sign in</h2>
    <p class="ul-sub">Enter your staff credentials to continue.</p>

    <!-- Error banner -->
    <div class="ul-error" *ngIf="error()">
      <i class="pi pi-exclamation-triangle"></i> {{ error() }}
    </div>

    <!-- Form -->
    <div class="ul-form">

      <!-- Identifier -->
      <div class="ul-field">
        <label>{{ identifierLabel }}<span class="ul-required">*</span></label>
        <div class="ul-input-wrap">
          <i class="pi pi-user ul-input-icon"></i>
          <input
            type="text"
            [(ngModel)]="identifier"
            [placeholder]="identifierPlaceholder"
            (keyup.enter)="submit()"
            [class.ul-input-error]="errors['identifier']"
            autocomplete="username"
          />
        </div>
        <span class="ul-field-error" *ngIf="errors['identifier']">{{ errors['identifier'] }}</span>
      </div>

      <!-- Password -->
      <div class="ul-field">
        <label>Password<span class="ul-required">*</span></label>
        <div class="ul-input-wrap">
          <i class="pi pi-lock ul-input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            (keyup.enter)="submit()"
            [class.ul-input-error]="errors['password']"
            autocomplete="current-password"
          />
          <button type="button" class="ul-toggle-pw" (click)="showPassword = !showPassword" tabindex="-1">
            <i class="pi" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'"></i>
          </button>
        </div>
        <span class="ul-field-error" *ngIf="errors['password']">{{ errors['password'] }}</span>
      </div>

      <!-- Remember me -->
      <div class="ul-remember">
        <label class="ul-checkbox-label">
          <input type="checkbox" [(ngModel)]="rememberMe" />
          <span>Remember me</span>
        </label>
      </div>

      <!-- Submit -->
      <button
        class="ul-submit ul-submit-staff"
        (click)="submit()"
        [disabled]="loading()"
        type="button"
      >
        <i class="pi" [ngClass]="loading() ? 'pi-spin pi-spinner' : 'pi-sign-in'"></i>
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </div>

    <!-- Footer -->
    <div class="ul-footer">
      Need access? <a href="javascript:void(0)">Contact administrator</a>
    </div>

  </div>
</div>
