@if (stats.length) {
            <div class="stat-strip">
                @for (stat of stats; track stat.label) {
                    <div class="stat-cell">
                        <span class="stat-label">{{ stat.label }}</span>
                        <span class="stat-value">{{ stat.value }}</span>
                        @if (stat.caption) {
                            <span class="stat-caption">{{ stat.caption }}</span>
                        }
                    </div>
                }
            </div>
        }
