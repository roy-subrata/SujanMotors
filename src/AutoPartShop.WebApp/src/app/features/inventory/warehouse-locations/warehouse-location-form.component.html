<div class="form-container">
  <div class="form-header">
    <h1>{{ pageTitle }}</h1>
    <button pButton type="button" icon="pi pi-arrow-left" class="p-button-text" (click)="goBack()"></button>
  </div>

  <p-card class="form-card">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">

      <!-- Warehouse -->
      <div class="form-group">
        <label for="warehouseId">{{ 'stock.warehouse' | translate }} <span class="required">*</span></label>
        <p-select
          inputId="warehouseId"
          formControlName="warehouseId"
          [options]="warehouseOptions"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          filterBy="label"
          [placeholder]="'warehouseLocations.selectWarehousePlaceholder' | translate"
          appendTo="body"
          class="w-full"
          [class.ng-invalid]="hasError('warehouseId')">
        </p-select>
        <small class="text-danger" *ngIf="hasError('warehouseId')">
          {{ getErrorMessage('warehouseId') }}
        </small>
      </div>

      <!-- Zone / Aisle / Rack / Bin -->
      <div class="form-row form-row-4">
        <div class="form-group col">
          <label for="zone">{{ 'warehouseLocations.zone' | translate }} <span class="required">*</span></label>
          <input
            pInputText
            id="zone"
            type="text"
            formControlName="zone"
            [placeholder]="'warehouseLocations.zonePlaceholder' | translate"
            maxlength="10"
            class="w-full"
            [class.ng-invalid]="hasError('zone')">
          <small class="text-danger" *ngIf="hasError('zone')">{{ getErrorMessage('zone') }}</small>
        </div>

        <div class="form-group col">
          <label for="aisle">{{ 'warehouseLocations.aisle' | translate }} <span class="required">*</span></label>
          <input
            pInputText
            id="aisle"
            type="text"
            formControlName="aisle"
            [placeholder]="'warehouseLocations.aislePlaceholder' | translate"
            maxlength="10"
            class="w-full"
            [class.ng-invalid]="hasError('aisle')">
          <small class="text-danger" *ngIf="hasError('aisle')">{{ getErrorMessage('aisle') }}</small>
        </div>

        <div class="form-group col">
          <label for="rack">{{ 'warehouseLocations.rack' | translate }} <span class="required">*</span></label>
          <input
            pInputText
            id="rack"
            type="text"
            formControlName="rack"
            [placeholder]="'warehouseLocations.rackPlaceholder' | translate"
            maxlength="10"
            class="w-full"
            [class.ng-invalid]="hasError('rack')">
          <small class="text-danger" *ngIf="hasError('rack')">{{ getErrorMessage('rack') }}</small>
        </div>

        <div class="form-group col">
          <label for="bin">{{ 'warehouseLocations.bin' | translate }} <span class="required">*</span></label>
          <input
            pInputText
            id="bin"
            type="text"
            formControlName="bin"
            [placeholder]="'warehouseLocations.binPlaceholder' | translate"
            maxlength="10"
            class="w-full"
            [class.ng-invalid]="hasError('bin')">
          <small class="text-danger" *ngIf="hasError('bin')">{{ getErrorMessage('bin') }}</small>
        </div>
      </div>

      <!-- Category (optional) -->
      <div class="form-group">
        <label for="categoryId">{{ 'common.labels.category' | translate }}</label>
        <p-select
          inputId="categoryId"
          formControlName="categoryId"
          [options]="categoryOptions"
          optionLabel="label"
          optionValue="value"
          [filter]="true"
          filterBy="label"
          [showClear]="true"
          [placeholder]="'warehouseLocations.noCategoryPlaceholder' | translate"
          appendTo="body"
          class="w-full">
        </p-select>
        <span class="field-hint">
          <i class="pi pi-info-circle"></i>
          {{ 'warehouseLocations.categoryHint' | translate }}
        </span>
      </div>

      <!-- Notes -->
      <div class="form-group">
        <label for="notes">{{ 'common.labels.notes' | translate }}</label>
        <textarea
          pInputTextarea
          id="notes"
          formControlName="notes"
          [placeholder]="'warehouseLocations.notesPlaceholder' | translate"
          class="w-full"
          rows="4">
        </textarea>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button pButton type="button" [label]="'common.actions.cancel' | translate" class="p-button-text" (click)="goBack()"></button>
        <button
          pButton
          type="submit"
          [label]="isEditMode ? ('warehouseLocations.updateLocationBtn' | translate) : ('warehouseLocations.createLocationBtn' | translate)"
          class="p-button-success"
          [loading]="isSubmitting"
          [disabled]="isSubmitting">
        </button>
      </div>
    </form>
  </p-card>
</div>

<p-toast position="top-right"></p-toast>
