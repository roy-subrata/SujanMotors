<!-- ============================================================
     VEHICLES LIST - ENTERPRISE UI (MATCHES SALES ORDERS LAYOUT)
     ============================================================ -->

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<app-page-container>
  <!-- ==================== PAGE HEADER ==================== -->
  <app-page-header
    [title]="'vehicles.title' | translate"
    [subtitle]="'vehicles.subtitle' | translate"
    [count]="totalRecords" [countLabel]="'vehicles.countLabel' | translate">
    <ng-container actions>
      <button class="btn-icon" [pTooltip]="'common.actions.refresh' | translate" tooltipPosition="bottom" (click)="refreshData()">
        <i class="pi pi-refresh" [class.pi-spin]="loading"></i>
      </button>
      <button class="btn-primary" (click)="createVehicle()">
        <i class="pi pi-plus"></i>
        <span>{{ 'vehicles.addVehicle' | translate }}</span>
      </button>
    </ng-container>
  </app-page-header>

  <!-- ==================== FILTER SECTION ==================== -->
  <app-filter-bar>
    <div search class="filter-group search-group">
      <div class="search-input-wrapper">
        <i class="pi pi-search"></i>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          [placeholder]="'vehicles.searchVehicles' | translate"
          (keyup.enter)="onSearch()"
          class="search-input" />
        <button *ngIf="searchTerm" class="search-clear" (click)="onSearchClear()">
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>

    <div filterActions class="filter-group filter-actions">
      <button class="btn-search" (click)="onSearch()">
        <i class="pi pi-search"></i>
        {{ 'common.actions.search' | translate }}
      </button>
      <button *ngIf="hasActiveFilters()" class="btn-clear" (click)="clearFilters()">
        <i class="pi pi-filter-slash"></i>
        {{ 'common.actions.clear' | translate }}
      </button>
    </div>

    <div activeFilters *ngIf="hasActiveFilters()" class="active-filters">
      <span class="active-filters-label">{{ 'common.labels.activeFilters' | translate }}</span>
      <span *ngIf="searchTerm" class="filter-chip">
        {{ 'common.labels.search' | translate }}: "{{ searchTerm }}"
        <i class="pi pi-times" (click)="onSearchClear()"></i>
      </span>
    </div>
  </app-filter-bar>

  <!-- ==================== LIST SECTION ==================== -->
  <app-vehicles-list
    [vehicles]="vehicles"
    [loading]="loading"
    [totalRecords]="totalRecords"
    [rows]="rows"
    [currentPage]="currentPage"
    (viewClick)="onViewClick($event)"
    (editClick)="onEditClick($event)"
    (pageChange)="onPageChange($event)"
    (vehicleDeleted)="onVehicleDeleted()">
  </app-vehicles-list>
</app-page-container>
