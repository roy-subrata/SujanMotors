<!-- ============================================================
     CATEGORIES LIST - ENTERPRISE UI (MATCHES SALES ORDERS LAYOUT)
     ============================================================ -->

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

<app-page-container>
  <!-- ==================== PAGE HEADER ==================== -->
  <app-page-header
    [title]="'categories.title' | translate"
    [subtitle]="'categories.subtitle' | translate"
    [count]="totalRecords" [countLabel]="'categories.countLabel' | translate">
    <ng-container actions>
      <button class="btn-icon" [pTooltip]="'common.actions.refresh' | translate" tooltipPosition="bottom" (click)="refreshData()">
        <i class="pi pi-refresh" [class.pi-spin]="loading"></i>
      </button>
      <button class="btn-primary" (click)="createCategory()">
        <i class="pi pi-plus"></i>
        <span>{{ 'categories.addCategory' | translate }}</span>
      </button>
    </ng-container>
  </app-page-header>

  <!-- ==================== FILTER SECTION ==================== -->
  <app-filter-bar>
    <!-- Search Input -->
    <div search class="filter-group search-group">
      <div class="search-input-wrapper">
        <i class="pi pi-search"></i>
        <input
          type="text"
          [(ngModel)]="searchTerm"
          [placeholder]="'categories.searchCategories' | translate"
          (keyup.enter)="onSearch()"
          class="search-input" />
        <button *ngIf="searchTerm" class="search-clear" (click)="clearSearchInput(); onSearch()">
          <i class="pi pi-times"></i>
        </button>
      </div>
    </div>

    <!-- Status Filter -->
    <div filters class="filter-group">
      <app-status-pill-filter
        [options]="statusOptions"
        [value]="filterStatusValue"
        (valueChange)="onStatusFilterChange($event)">
      </app-status-pill-filter>
    </div>

    <!-- Filter Actions -->
    <div filterActions class="filter-group filter-actions">
      <button class="btn-search" (click)="onSearch()">
        <i class="pi pi-search"></i>
        {{ 'common.actions.apply' | translate }}
      </button>
      <button class="text-btn" (click)="moreFiltersVisible = true">
        {{ 'common.labels.moreFilters' | translate }}
      </button>
      <button *ngIf="hasActiveFilters()" class="btn-clear" (click)="clearFilters()">
        <i class="pi pi-filter-slash"></i>
        {{ 'common.actions.clear' | translate }}
      </button>
    </div>

    <!-- Active Filters Display -->
    <div activeFilters *ngIf="hasActiveFilters()" class="active-filters">
      <span class="active-filters-label">{{ 'common.labels.activeFilters' | translate }}</span>
      <span *ngIf="searchTerm" class="filter-chip">
        {{ 'common.labels.search' | translate }}: "{{ searchTerm }}"
        <i class="pi pi-times" (click)="clearSearchInput(); onSearch()"></i>
      </span>
      <span *ngIf="filterStatus !== null" class="filter-chip">
        {{ 'common.labels.status' | translate }}: {{ getStatusLabel(filterStatus) }}
        <i class="pi pi-times" (click)="filterStatus = null; onFilterChange()"></i>
      </span>
    </div>
  </app-filter-bar>

  <app-more-filters-dialog
    [options]="statusOptions"
    [selected]="filterStatusValue"
    [previewCount]="totalRecords"
    [(visible)]="moreFiltersVisible"
    (apply)="onStatusFilterChange($event)">
  </app-more-filters-dialog>

  <!-- ==================== LIST SECTION ==================== -->
  <div class="list-wrapper">
  <app-categories-list
    [categories]="categories"
    [loading]="loading"
    [totalRecords]="totalRecords"
    [rows]="rows"
    [currentPage]="currentPage"
    (editCategory)="selectAndOpenUpdate($event)"
    (deleteCategory)="selectAndDelete($event)"
    (toggleCategoryStatus)="selectAndToggleStatus($event)"
    (addSubcategory)="selectAndAddSubcategory($event)"
    (pageChange)="onPageChange($event)">
  </app-categories-list>
  </div>
</app-page-container>

<!-- ==================== FORM DIALOG ==================== -->
<app-categories-form-dialog
  [displayCreateDialog]="displayCreateDialog"
  [displayUpdateDialog]="displayUpdateDialog"
  [selectedCategory]="selectedCategory"
  [selectedParentCategory]="selectedParentCategory"
  (displayCreateDialogChange)="onDisplayCreateDialogChange($event)"
  (displayUpdateDialogChange)="onDisplayUpdateDialogChange($event)"
  (createSuccess)="onCreateSuccess()"
  (updateSuccess)="onUpdateSuccess()">
</app-categories-form-dialog>
