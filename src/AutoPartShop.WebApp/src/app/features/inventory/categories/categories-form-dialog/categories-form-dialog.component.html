<p-toast position="top-right"></p-toast>

<!-- ==================== CREATE CATEGORY DIALOG ==================== -->
<p-dialog
    [(visible)]="displayCreateDialog"
    [header]="'categories.addCategory' | translate"
    [modal]="true"
    [style]="{width: '600px'}"
    [breakpoints]="{'960px': '90vw', '640px': '100vw'}"
    [draggable]="false"
    [resizable]="false"
    (onShow)="onCreateDialogShow()"
    (onHide)="onCreateDialogHide()">

    <form [formGroup]="createForm" class="form-container">

        <!-- Parent Category (full width) -->
        <div class="form-group">
            <label for="c-parent" class="form-label">{{ 'categories.parentCategory' | translate }}</label>
            <app-lazy-autocomplete
                id="c-parent"
                formControlName="parentCategory"
                [(ngModel)]="selectedParentCategory"
                [fetchFn]="fetchParentCategories.bind(this)"
                [placeholder]="'categories.parentCategoryPlaceholder' | translate"
                [pageSize]="20"
                [itemSize]="52"
                optionLabel="name"
                [disabled]="isCreating()"
                (onItemSelect)="onParentCategorySelect($event)"
                (onClearEvent)="onParentCategoryCleared()">
                <ng-template let-cat #item>
                    <div class="autocomplete-item">{{ cat.name }}</div>
                </ng-template>
            </app-lazy-autocomplete>
            <small class="hint-message">{{ 'categories.parentCategoryHint' | translate }}</small>
        </div>

        <!-- Row: Name -->
        <div class="form-row">
            <div class="form-group">
                <label for="c-name" class="form-label"><span class="required">*</span> {{ 'common.labels.name' | translate }}</label>
                <input type="text" pInputText id="c-name" formControlName="name"
                       [placeholder]="'categories.placeholders.name' | translate" class="form-input" />
                <small class="form-error" *ngIf="createForm.get('name')?.touched && createForm.get('name')?.invalid">
                    {{ 'categories.messages.nameRequired' | translate }}
                </small>
            </div>
        </div>

        <!-- Description (full width) -->
        <div class="form-group">
            <label for="c-description" class="form-label">{{ 'common.labels.description' | translate }}</label>
            <textarea pInputTextarea id="c-description" formControlName="description" rows="2"
                      [placeholder]="'categories.placeholders.description' | translate" class="form-input"></textarea>
        </div>

        <!-- Row: Display Order + Active -->
        <div class="form-row">
            <div class="form-group">
                <label for="c-order" class="form-label">{{ 'categories.displayOrder' | translate }}</label>
                <p-inputNumber id="c-order" formControlName="displayOrder"
                               [min]="0" styleClass="form-input-number"></p-inputNumber>
                <small class="hint-message">{{ 'common.labels.orderHint' | translate }}</small>
            </div>
            <div class="form-group form-checkbox-group">
                <p-checkbox formControlName="isActive" [binary]="true" inputId="c-active"></p-checkbox>
                <label for="c-active" class="form-label checkbox-label">{{ 'common.status.active' | translate }}</label>
            </div>
        </div>

    </form>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <button pButton type="button" [label]="'common.actions.cancel' | translate" icon="pi pi-times"
                    class="p-button-text p-button-secondary"
                    [disabled]="isCreating()" (click)="onCreateDialogHide()"></button>
            <button pButton type="button" [label]="'categories.addCategory' | translate" icon="pi pi-check"
                    class="p-button-success" (click)="onCreateSubmit()"
                    [disabled]="isCreating()" [loading]="isCreating()"></button>
        </div>
    </ng-template>
</p-dialog>


<!-- ==================== UPDATE CATEGORY DIALOG ==================== -->
<p-dialog
    [(visible)]="displayUpdateDialog"
    [header]="('categories.editCategory' | translate) + ': ' + (selectedCategory?.name || '')"
    [modal]="true"
    [style]="{width: '600px'}"
    [breakpoints]="{'960px': '90vw', '640px': '100vw'}"
    [draggable]="false"
    [resizable]="false"
    (onShow)="onUpdateDialogShow()"
    (onHide)="onUpdateDialogHide()">

    <form [formGroup]="updateForm" class="form-container">

        <!-- Name (full width) -->
        <div class="form-group">
            <label for="u-name" class="form-label"><span class="required">*</span> {{ 'common.labels.name' | translate }}</label>
            <input type="text" pInputText id="u-name" formControlName="name"
                   [placeholder]="'categories.placeholders.name' | translate" class="form-input" />
            <small class="form-error" *ngIf="updateForm.get('name')?.touched && updateForm.get('name')?.invalid">
                {{ 'categories.messages.nameRequired' | translate }}
            </small>
        </div>

        <!-- Description (full width) -->
        <div class="form-group">
            <label for="u-description" class="form-label">{{ 'common.labels.description' | translate }}</label>
            <textarea pInputTextarea id="u-description" formControlName="description" rows="2"
                      [placeholder]="'categories.placeholders.description' | translate" class="form-input"></textarea>
        </div>

        <!-- Row: Display Order + Active -->
        <div class="form-row">
            <div class="form-group">
                <label for="u-order" class="form-label">{{ 'categories.displayOrder' | translate }}</label>
                <p-inputNumber id="u-order" formControlName="displayOrder"
                               [min]="0" styleClass="form-input-number"></p-inputNumber>
            </div>
            <div class="form-group form-checkbox-group">
                <p-checkbox formControlName="isActive" [binary]="true" inputId="u-active"></p-checkbox>
                <label for="u-active" class="form-label checkbox-label">{{ 'common.status.active' | translate }}</label>
            </div>
        </div>

    </form>

    <ng-template pTemplate="footer">
        <div class="dialog-footer">
            <button pButton type="button" [label]="'common.actions.cancel' | translate" icon="pi pi-times"
                    class="p-button-text p-button-secondary"
                    [disabled]="isUpdating()" (click)="onUpdateDialogHide()"></button>
            <button pButton type="button" [label]="'common.actions.saveChanges' | translate" icon="pi pi-check"
                    class="p-button-info" (click)="onUpdateSubmit()"
                    [disabled]="isUpdating()" [loading]="isUpdating()"></button>
        </div>
    </ng-template>
</p-dialog>
