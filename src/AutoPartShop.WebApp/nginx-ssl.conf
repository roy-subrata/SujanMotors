# ---------------------------------------------------------------------------
# PRODUCTION nginx config — TLS terminated here (option 2).
#
# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
# REQUIRES certificates before `up` or nginx refuses to start (fail-fast):
#
#   deployment/certs/fullchain.pem   <- full chain incl. intermediates
#   deployment/certs/privkey.pem     <- private key, chown root, chmod 600
#
# Get them from Let's Encrypt (certbot certonly --standalone) or a
# Cloudflare Origin certificate. Port 80 stays open ONLY for ACME renewal
# challenges and redirects everything else to HTTPS.
# ---------------------------------------------------------------------------

# HTTP -> HTTPS redirect (+ ACME challenges for certbot renewals)
server {
    listen 80;
    server_name _;

    # Let certbot renewals answer over plain HTTP; nothing else is served here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: force HTTPS for one year once you are sure TLS is stable.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Security headers -----------------------------------------------------
    # CSP notes:
    #   style-src 'unsafe-inline'  - Angular build injects critical CSS inline.
    #   connect-src wss:           - SignalR websockets negotiate same-origin but
    #                                upgrade to wss, which 'self' does not cover.
    #   img-src data: blob:        - QR codes/barcodes render via canvas/data URLs;
    #                                previews may use blob URLs.
    #   frame-src blob:            - PDF/label previews embedded in iframes.
    #   Fonts come from Google Fonts (see index.html preconnects).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: https://fonts.googleapis.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Performance -----------------------------------------------------------
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed static assets (Angular CLI outputHashing) — cache aggressively
    # because the filename changes when content changes.
    # NOTE: add_header in a location block replaces ALL server-level add_header
    # directives, so we must re-add security headers here.
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: https://fonts.googleapis.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://autopartshop.api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location /hubs {
        proxy_pass http://autopartshop.api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html and the Angular service-worker's own control files must
    # never be cached — they're what tells the browser/SW a new build
    # exists. Without this, a deploy can succeed on the server while
    # browsers keep serving yesterday's index.html (and its old hashed
    # bundle references) indefinitely. Re-adds the security headers per
    # the NOTE above — add_header in a location block replaces ALL
    # server-level add_header directives.
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' wss: https://fonts.googleapis.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }
}
