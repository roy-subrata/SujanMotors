# =============================================================================
# PRODUCTION BASE — Docker Compose for the production stack
# =============================================================================
#
# WHAT THIS FILE DOES:
#   Defines the complete production stack: API, Web (Angular), and Database.
#   This is the BASE compose file. For production, combine it with the override:
#
#     docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# ENVIRONMENT VARIABLES:
#   All secrets are read from a .env file in this directory (deployment/.env).
#   Copy .env.prod.example to .env and fill in real values.
#   REQUIRED secrets (compose fails fast without them): DB_PASSWORD, JWT_SECRET,
#   SEED_ADMIN_PASSWORD. There are NO insecure fallbacks.
#
# ON THE VPS:
#   This stack lives in /opt/sujanmotors-prod/ on the Hostinger VPS.
#   Deployed automatically when code is merged to the "main" branch.
#
# ARCHITECTURE:
#   Internet → nginx TLS :443 (web container) → API container (:8080 internal)
#                                              ↳ DB container (:1433 internal)
#   Public ports: 443 only. DB/API/Seq host bindings are loopback (127.0.0.1) so
#   they stay reachable for local debugging via SSH but not from the internet.
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SQL Server 2025 Database
  # ---------------------------------------------------------------------------
  # The primary database. Uses a named volume for data persistence.
  # Migrations run automatically on API startup (DatabaseSeeder.MigrateAsync).
  autopartshop.db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: autopartshop.db            # Stable name for container-to-container networking
    environment:
      - ACCEPT_EULA=Y                         # Required: accept SQL Server license agreement
      # Fail-fast: no insecure default. Copy deployment/.env.example to .env first.
      - SA_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in deployment/.env}
      - MSSQL_PID=Developer                   # Free Developer license (full feature set)
    ports:
      # Loopback-only: SSMS / local API reach it via localhost on the HOST, but the
      # internet cannot. Container-to-container traffic uses the internal network.
      - "127.0.0.1:1433:1433"
    volumes:
      - autopart_mssql_data:/var/opt/mssql    # Persistent data (survives container restarts)
      # Shared backup folder (also mounted into the API container). The API writes .bak files
      # here and SQL Server reads them during RESTORE. Create it on the VPS before first run:
      #   mkdir -p ./backups && chown 10001:0 ./backups
      - ./backups:/var/opt/mssql/backups
    restart: always                           # Always restart in prod (even after server reboot)
    healthcheck:
      # Health check: verify SQL Server is ready before allowing API to start
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:?set DB_PASSWORD in deployment/.env}' -Q 'SELECT 1' -No || exit 1"]
      interval: 10s                           # Check every 10 seconds
      timeout: 5s                             # Fail if no response within 5 seconds
      retries: 10                             # Mark unhealthy after 10 consecutive failures
      start_period: 30s                       # Give SQL Server 30 seconds to start up

  # ---------------------------------------------------------------------------
  # .NET 10 Web API
  # ---------------------------------------------------------------------------
  # The backend REST API. Built from src/AutoPartShop.Api/Dockerfile.
  # NOT exposed to the internet — accessed only through nginx reverse proxy.
  autopartshop.api:
    build:
      context: ..                             # Repo root (Dockerfile needs all .csproj files)
      dockerfile: src/AutoPartShop.Api/Dockerfile
    image: smapi:local                        # Local image tag (avoids Docker Hub)
    container_name: autopartshop.api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production     # Disables Swagger, detailed errors
      - ASPNETCORE_HTTP_PORTS=8080            # API listens on port 8080 inside container
      # Database connection: uses service name "autopartshop.db" for DNS resolution
      - ConnectionStrings__AutoPartDb=Server=autopartshop.db,1433;Database=${DB_NAME:-AutoPartShopProdDb};User=sa;Password=${DB_PASSWORD:?set DB_PASSWORD in deployment/.env};TrustServerCertificate=True;
      # JWT authentication settings — the signing key is REQUIRED, no insecure default
      - JwtSettings__SecretKey=${JWT_SECRET:?set JWT_SECRET in deployment/.env (openssl rand -base64 64)}
      - JwtSettings__Issuer=AutoPartShopAPI
      - JwtSettings__Audience=AutoPartShopClient
      - JwtSettings__ExpiryInMinutes=${JWT_EXPIRY_MINUTES:-60}
      - JwtSettings__RefreshTokenExpiryInDays=${JWT_REFRESH_DAYS:-7}
      # Twilio integration (SMS / WhatsApp) — leave blank if not used
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID:-}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN:-}
      - Twilio__SmsMsgServiceSid=${TWILIO_SMS_SID:-}
      - Twilio__WhatsAppMsgServiceSid=${TWILIO_WHATSAPP_SID:-}
      # SMTP email settings — leave blank if not used
      - Smtp__Host=${SMTP_HOST:-}
      - Smtp__Port=${SMTP_PORT:-587}
      - Smtp__Username=${SMTP_USERNAME:-}
      - Smtp__Password=${SMTP_PASSWORD:-}
      - Smtp__FromEmail=${SMTP_FROM_EMAIL:-}
      - Smtp__FromName=${SMTP_FROM_NAME:-SujanMotors}
      # Seed settings — auto-create admin user on first run
      # Fail-fast: REQUIRED so a first-run stack never lands on the old
      # publicly-known default admin password.
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in deployment/.env}
      # Database backups: shared folder as seen by this container / by SQL Server,
      # plus the Google service-account key JSON for Drive uploads (leave blank to skip upload)
      - Backup__Directory=/app/backups
      - Backup__SqlServerDirectory=/var/opt/mssql/backups
      - GoogleDrive__ServiceAccountKeyJson=${GDRIVE_SA_KEY_JSON:-}
      # Business-day timezone. Dashboard and report date windows follow the shop's calendar
      # day, not the server's UTC day (360 = UTC+6, Bangladesh).
      - Shop__TzOffsetMinutes=${SHOP_TZ_OFFSET_MINUTES:-360}
      # Request rate limiting. Enabled is the kill switch — flip it and restart, no rebuild.
      # Limits are per minute: auth = login, session = token refresh/logout,
      # public = anonymous endpoints, global = everything else (per user).
      - RateLimiting__Enabled=${RATE_LIMIT_ENABLED:-true}
      - RateLimiting__AuthPermitLimit=${RATE_LIMIT_AUTH:-10}
      - RateLimiting__SessionPermitLimit=${RATE_LIMIT_SESSION:-60}
      - RateLimiting__PublicPermitLimit=${RATE_LIMIT_PUBLIC:-60}
      - RateLimiting__UploadPermitLimit=${RATE_LIMIT_UPLOAD:-30}
      - RateLimiting__GlobalPermitLimit=${RATE_LIMIT_GLOBAL:-600}
      # Real client IP recovery, which the per-IP limits above depend on.
      # FORWARDED_HOP_COUNT: nginx alone = 1; Cloudflare/LB in front of nginx = 2.
      # FORWARDED_KNOWN_NETWORKS: CIDR of the hop to trust. Docker assigns the nginx
      # container an unstable address, so trust the bridge subnet rather than an IP.
      # Leave blank to accept X-Forwarded-For from anyone (spoofable; warned at startup).
      - ForwardedHeaders__ForwardLimit=${FORWARDED_HOP_COUNT:-1}
      - ForwardedHeaders__KnownNetworks__0=${FORWARDED_KNOWN_NETWORK:-172.16.0.0/12}
      # Log shipping: Serilog pushes structured logs to the Seq container
      - Seq__Url=http://seq                    # Seq listens on :80 for ingestion + UI
      - Seq__ApiKey=${SEQ_API_KEY:-}
    volumes:
      - ./backups:/app/backups                # Same host folder as the DB container's backup mount
      # Uploaded product images/videos and employee photos. WITHOUT this mount they live
      # inside the container and are destroyed by every rebuild/recreate, leaving the
      # ProductMedia/StoredFiles rows pointing at 404s. Back this folder up with the DB.
      - ./uploads:/app/App_Data/uploads
    # Loopback-only: host-side curl / SSH debugging only, not internet-reachable.
    # Browsers and the mobile app must go through nginx TLS.
    ports:
      - "127.0.0.1:5000:8080"
    depends_on:
      autopartshop.db:
        condition: service_healthy            # Wait for DB health check before starting
    restart: always                           # Always restart in prod

  # ---------------------------------------------------------------------------
  # Angular Frontend (served by nginx)
  # ---------------------------------------------------------------------------
  # Builds the Angular app and serves it via nginx.
  # nginx also reverse-proxies /api and /hubs to the API container.
  # This is the ONLY container exposed to the internet (port 4200).
  autopartshop.web:
    build:
      context: ../src/AutoPartShop.WebApp    # Angular project directory
      dockerfile: dockerfile
      args:
        ENV_NAME: production                  # Uses environment.prod.ts (relative /api URL)
    image: smweb:local                        # Local image tag
    container_name: autopartshop.web
    ports:
      - "4200:80"                             # Only public-facing port (web UI)
    depends_on:
      - autopartshop.api                      # API must be running before web starts
    restart: always                           # Always restart in prod

  # ---------------------------------------------------------------------------
  # Seq — structured log server + UI
  # ---------------------------------------------------------------------------
  # The only observability component: the API's Serilog sink ships logs here
  # (Seq__Url). UI binding is loopback-only - reach it via SSH tunnel:
  #   ssh -L 5341:localhost:5341 <vps>  (then browse http://localhost:5341).
  # Set SEQ_ADMIN_PASSWORD_HASH in .env to require login (strongly recommended); generate with:
  #   docker run --rm datalust/seq config hash '<password>'
  seq:
    image: datalust/seq:2024.3
    container_name: autopartshop.seq
    environment:
      - ACCEPT_EULA=Y                          # Required: accept the Seq licence
      - SEQ_FIRSTRUN_ADMINPASSWORDHASH=${SEQ_ADMIN_PASSWORD_HASH:-}
    volumes:
      - autopart_seq_data:/data                # Persistent log storage
    ports:
      # Loopback-only: structured logs must not be publicly readable.
      - "127.0.0.1:5341:80"
    restart: always

# Named volumes: persistent storage that survives container restarts
volumes:
  autopart_mssql_data:                        # SQL Server data (production)
  autopart_seq_data:                          # Seq log storage
